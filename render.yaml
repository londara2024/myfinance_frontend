# =============================================================================
# Render Blueprint for the MyFinance frontend.
#
# Optional — everything here can be typed into the dashboard instead. Its value
# is that the deploy configuration is reviewable and reproducible rather than
# living only in a web form.
#
# To use it: Render dashboard -> New + -> Blueprint -> pick this repository.
#
# NOTE: this repository's root IS the Next.js app, so there is no rootDir. The
# backend lives in a separate repository with its own Dockerfile.
# =============================================================================

services:
  - type: web
    name: myfinance-web
    runtime: node
    plan: free
    branch: main

    # Same region as the backend and its database (the Postgres host is
    # *.oregon-postgres.render.com). Every page render makes server-to-server
    # calls to the backend, so a cross-region hop would be paid on every request.
    region: oregon

    # `npm ci` not `npm install`: it installs exactly what package-lock.json
    # pins and fails if the lockfile and package.json disagree, so a deploy can
    # never quietly resolve a different dependency tree than the one tested.
    #
    # `--include=dev` is belt to the braces in package.json.
    #
    # The braces: the six packages `next build` actually executes — tailwindcss,
    # @tailwindcss/postcss, typescript and the three @types/* — live in
    # `dependencies`, not `devDependencies`, so no amount of pruning can remove
    # them. See the note in README.md; do not "tidy" them back.
    #
    # Why both: a Render service created by hand ignores this file entirely, and
    # its dashboard Build Command may well be a plain `npm ci`. Under
    # NODE_ENV=production npm reads that as `omit=dev` and the build dies on
    # `Cannot find module '@tailwindcss/postcss'` — which reads like a missing
    # dependency rather than a pruned one. The package.json split fixes that case
    # too; this flag just makes the intent explicit where the config is read.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start

    # Answered by src/app/api/health/route.ts, which deliberately does NOT call
    # the backend — see the comment there. A health check that depended on the
    # backend would let the backend spinning down take this service with it.
    healthCheckPath: /api/health

    envVars:
      # The one variable this app actually needs. Server-side only: it is read
      # in src/lib/api/client.ts and never shipped to the browser.
      - key: BACKEND_URL
        value: https://myfinance-backend-aidt.onrender.com

      # Also pinned in .node-version, which Render reads on its own. Stated
      # twice deliberately — the file covers anyone building locally or in CI,
      # this covers reading the deploy config on its own.
      - key: NODE_VERSION
        value: "22"

# DO NOT add NODE_ENV=production here.
#
# It was here, and it broke the build. A Render environment variable applies to
# the build as well as the runtime, and npm reads NODE_ENV=production as
# `omit=dev` — so `npm ci` pruned 246 packages including the whole build
# toolchain, and the build failed on `Cannot find module '@tailwindcss/postcss'`.
#
# It is also unnecessary. Next sets NODE_ENV itself: `next start` and
# `next build` default it to "production", `next dev` to "development"
# (node_modules/next/dist/bin/next, the `preAction` hook). So the httpOnly
# cookie's `secure` flag in src/lib/api/session.ts is on in a deploy without
# anyone declaring it.
